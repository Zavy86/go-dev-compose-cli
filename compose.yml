name: dev-environment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    image: alpine
    command: ["sh", "-c", "echo 'Auth Service avviato...' && sleep 3600"]
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: alpine
    command: ["sh", "-c", "echo 'Order Service avviato...' && sleep 3600"]
    depends_on:
      - auth-service

  payment-service:
    image: alpine
    command: ["sh", "-c", "echo 'Payment Service avviato...' && sleep 3600"]
    depends_on:
      - auth-service
      - order-service
